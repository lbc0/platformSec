stages: [scan, build, image-scan, push, sign, selftest]

variables:
  TRIVY_IMAGE: "docker.io/aquasec/trivy:0.76.0"
  BUILDAH_IMAGE: "quay.io/buildah/stable"
  SKOPEO_IMAGE: "quay.io/skopeo/stable"
  ALPINE_IMAGE: "docker.io/library/alpine:3"
  REGISTRY: "harbor.lab.test"
  IMAGE_REPO: "harbor.lab.test/lab/maliki"
  COSIGN_VERSION: "v3.1.2"
  TRIVY_NO_PROGRESS: "true"
  TRIVY_CACHE_DIR: "$CI_PROJECT_DIR/.trivycache"

default:
  tags: [lab]
  cache:
    key: trivy
    paths: [.trivycache/]

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_PIPELINE_SOURCE == "web"

.trivy:
  image:
    name: $TRIVY_IMAGE
    entrypoint: [""]

.main_only:
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# ---------------- stage ----------------
iac-scan:
  extends: .trivy
  stage: scan
  script:
    - trivy --version
    - trivy config --exit-code 1 --severity HIGH,CRITICAL terraform/
    - trivy config --exit-code 1 --severity HIGH,CRITICAL app/

secret-scan:
  extends: .trivy
  stage: scan
  script:
    - trivy fs --scanners secret --exit-code 1 --skip-dirs terraform/.terraform --skip-dirs tests .

# ---------------- stage: build (rootless, nothing is pushed) ----------------
build-image:
  stage: build
  image:
    name: $BUILDAH_IMAGE
    entrypoint: [""]
  variables:
    STORAGE_DRIVER: vfs
    BUILDAH_ISOLATION: chroot
  script:
    - buildah build --format oci -f app/Dockerfile $EXTRA_BUILD_ARGS -t localhost/maliki:$CI_COMMIT_SHORT_SHA app
    - buildah push localhost/maliki:$CI_COMMIT_SHORT_SHA oci:image-oci
  artifacts:
    paths: [image-oci]
    expire_in: 1 hour

# ---------------- stage: image-scan (SBOM first, then the gate) ----------------
image-scan:
  extends: .trivy
  stage: image-scan
  dependencies: [build-image]
  script:
    - trivy image --input image-oci --format cyclonedx --output sbom.cdx.json
    - trivy image --input image-oci --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1
  artifacts:
    when: always
    paths: [sbom.cdx.json]
    expire_in: 1 week

# ---------------- stage: push (main only) ----------------
push-image:
  extends: .main_only
  stage: push
  image:
    name: $SKOPEO_IMAGE
    entrypoint: [""]
  dependencies: [build-image]
  script:
    - skopeo copy --dest-cert-dir pki --dest-creds "$HARBOR_ROBOT_USER:$HARBOR_ROBOT_PASSWORD" --digestfile digest.txt oci:image-oci docker://$IMAGE_REPO:$CI_COMMIT_SHORT_SHA
    - echo "IMAGE_DIGEST=$(cat digest.txt)" > push.env
  artifacts:
    reports:
      dotenv: push.env

# ---------------- stage: sign (main only) ----------------
sign-image:
  extends: .main_only
  stage: sign
  image: $ALPINE_IMAGE
  dependencies: [image-scan, push-image]
  script:
    - apk add --no-cache curl jq
    - curl -fsSL -o /usr/local/bin/cosign "https://github.com/sigstore/cosign/releases/download/${COSIGN_VERSION}/cosign-linux-amd64"
    - echo "${COSIGN_SHA256}  /usr/local/bin/cosign" | sha256sum -c -
    - chmod +x /usr/local/bin/cosign
    - export SSL_CERT_FILE="$PWD/pki/lab-ca.crt"
    - printf '%s' "$HARBOR_ROBOT_PASSWORD" | cosign login "$REGISTRY" -u "$HARBOR_ROBOT_USER" --password-stdin
    - REF="$IMAGE_REPO@$IMAGE_DIGEST"
    - cosign sign --yes --key "$COSIGN_KEY_FILE" --signing-config cosign.config "$REF"
    - cosign attest --yes --key "$COSIGN_KEY_FILE" --type cyclonedx --predicate sbom.cdx.json "$REF"
    - cosign verify --key pki/cosign.pub --insecure-ignore-tlog=true "$REF"
    - cosign verify-attestation --key pki/cosign.pub --type cyclonedx --insecure-ignore-tlog=true "$REF" > /dev/null
    - echo "Signed and verified $REF"
