[defaults]
inventory = inventory/generated.json
roles_path = roles
private_key_file = ~/.ssh/lab_ed25519
interpreter_python = auto_silent
remote_tmp = /tmp/.ansible-${USER}/tmp
retry_files_enabled = False
timeout = 30

[ssh_connection]
pipelining = True
# LAB-ONLY: trust-on-first-use host keys, kept in a project file that `make down` deletes,
# because every rebuild creates new host keys for the same IPs.
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile=.known_hosts -o IdentitiesOnly=yes
