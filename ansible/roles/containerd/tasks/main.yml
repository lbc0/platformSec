- name: Ensure apt keyrings directory exists
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"

- name: Docker apt signing key (for containerd.io)
  ansible.builtin.get_url:
    url: https://download.docker.com/linux/ubuntu/gpg
    dest: /etc/apt/keyrings/docker.asc
    mode: "0644"

- name: Docker apt repository
  ansible.builtin.deb822_repository:
    name: docker
    types: deb
    uris: https://download.docker.com/linux/ubuntu
    suites: "{{ ansible_facts['distribution_release'] }}"
    components: stable
    architectures: amd64
    signed_by: /etc/apt/keyrings/docker.asc
    state: present

- name: Install containerd
  ansible.builtin.apt:
    name: containerd.io
    state: present
    update_cache: true
    lock_timeout: 300

- name: Generate the default containerd config
  ansible.builtin.command: containerd config default
  register: containerd_default
  changed_when: false

- name: Write the config only if it does not exist yet
  ansible.builtin.copy:
    content: "{{ containerd_default.stdout }}\n"
    dest: /etc/containerd/config.toml
    mode: "0644"
    force: false
  notify: Restart containerd

- name: Use the systemd cgroup driver
  ansible.builtin.replace:
    path: /etc/containerd/config.toml
    regexp: 'SystemdCgroup = false'
    replace: 'SystemdCgroup = true'
  notify: Restart containerd

- name: Point the CRI at /etc/containerd/certs.d (skipped if already set)
  ansible.builtin.replace:
    path: /etc/containerd/config.toml
    regexp: "^(\\s*)config_path = ['\"]{2}\\s*$"
    replace: "\\1config_path = '/etc/containerd/certs.d'"
  notify: Restart containerd

- name: certs.d root
  ansible.builtin.file:
    path: /etc/containerd/certs.d
    state: directory
    mode: "0755"

- name: Enable and start containerd
  ansible.builtin.systemd:
    name: containerd
    enabled: true
    state: started

- name: Apply containerd config now
  ansible.builtin.meta: flush_handlers
