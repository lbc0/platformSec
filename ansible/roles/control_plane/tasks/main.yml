- name: Ensure /etc/kubernetes exists
  ansible.builtin.file:
    path: /etc/kubernetes
    state: directory
    mode: "0755"

- name: Render kubeadm config
  ansible.builtin.template:
    src: kubeadm-config.yaml.j2
    dest: /etc/kubernetes/kubeadm-config.yaml
    mode: "0600"

- name: Initialise the control plane (runs once; skipped if admin.conf exists)
  ansible.builtin.command: kubeadm init --config /etc/kubernetes/kubeadm-config.yaml
  args:
    creates: /etc/kubernetes/admin.conf

- name: kubeconfig directory for the admin user
  ansible.builtin.file:
    path: "/home/{{ admin_user }}/.kube"
    state: directory
    owner: "{{ admin_user }}"
    group: "{{ admin_user }}"
    mode: "0700"

- name: kubeconfig for the admin user on the node
  ansible.builtin.copy:
    src: /etc/kubernetes/admin.conf
    dest: "/home/{{ admin_user }}/.kube/config"
    remote_src: true
    owner: "{{ admin_user }}"
    group: "{{ admin_user }}"
    mode: "0600"

- name: Copy the vendored Calico manifests
  ansible.builtin.copy:
    src: "calico-{{ calico_version }}/"
    dest: /etc/kubernetes/calico/
    mode: "0644"
  when: cni == 'calico'

# CRDs and the operator are large; server-side apply avoids the "annotation too long" error.
- name: Apply the Calico CRDs and the Tigera operator
  ansible.builtin.command: >-
    kubectl --kubeconfig /etc/kubernetes/admin.conf apply --server-side --force-conflicts
    -f /etc/kubernetes/calico/crds.yaml -f /etc/kubernetes/calico/tigera-operator.yaml
  register: calico_op
  changed_when: "'serverside-applied' in calico_op.stdout"
  when: cni == 'calico'

- name: Wait for the operator to become available
  ansible.builtin.command: >-
    kubectl --kubeconfig /etc/kubernetes/admin.conf -n tigera-operator
    rollout status deploy/tigera-operator --timeout=180s
  changed_when: false
  when: cni == 'calico'

- name: Apply the Calico Installation resource
  ansible.builtin.command: >-
    kubectl --kubeconfig /etc/kubernetes/admin.conf apply --server-side --force-conflicts
    -f /etc/kubernetes/calico/custom-resources.yaml
  register: calico_cr
  changed_when: "'serverside-applied' in calico_cr.stdout"
  retries: 10
  delay: 10
  until: calico_cr.rc == 0
  when: cni == 'calico'

- name: Wait until Calico reports Available
  ansible.builtin.command: >-
    kubectl --kubeconfig /etc/kubernetes/admin.conf wait tigerastatus/calico
    --for=condition=Available --timeout=60s
  register: calico_ready
  retries: 20
  delay: 15
  until: calico_ready.rc == 0
  changed_when: false
  when: cni == 'calico'

- name: Create a join command (the token is a credential)
  ansible.builtin.command: kubeadm token create --print-join-command
  register: join_cmd_raw
  changed_when: false
  no_log: true

- name: Remember the join command for the worker play
  ansible.builtin.set_fact:
    join_command: "{{ join_cmd_raw.stdout }}"
  no_log: true

- name: Fetch the admin kubeconfig to your workstation
  ansible.builtin.fetch:
    src: /etc/kubernetes/admin.conf
    dest: "{{ playbook_dir }}/../../.kube/lab.conf"
    flat: true

- name: Restrict the local kubeconfig permissions
  ansible.builtin.file:
    path: "{{ playbook_dir }}/../../.kube/lab.conf"
    mode: "0600"
  delegate_to: localhost
  become: false
