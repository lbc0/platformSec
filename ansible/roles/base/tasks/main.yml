- name: Wait for cloud-init to finish
  ansible.builtin.command: cloud-init status --wait
  changed_when: false

- name: Install base packages
  ansible.builtin.apt:
    name: [ca-certificates, curl, gnupg, apt-transport-https]
    state: present
    update_cache: true
    cache_valid_time: 3600
    lock_timeout: 300

- name: Static host entries for all lab nodes
  ansible.builtin.lineinfile:
    path: /etc/hosts
    regexp: '^{{ hostvars[item].ansible_host | regex_escape }}\s'
    line: "{{ hostvars[item].ansible_host }} {{ item }}.{{ domain_name }} {{ item }}"
  loop: "{{ groups['all'] }}"

- name: Disable swap now
  ansible.builtin.command: swapoff -a
  when: ansible_facts['swaptotal_mb'] | int > 0

- name: Comment out swap in fstab
  ansible.builtin.replace:
    path: /etc/fstab
    regexp: '^([^#].*\sswap\s.*)$'
    replace: '# \1'

- name: Load kernel modules for Kubernetes networking
  community.general.modprobe:
    name: "{{ item }}"
    state: present
    persistent: present
  loop: [overlay, br_netfilter]

- name: Kernel parameters for Kubernetes
  ansible.posix.sysctl:
    name: "{{ item.key }}"
    value: "{{ item.value }}"
    sysctl_file: /etc/sysctl.d/99-k8s.conf
    reload: true
  loop:
    - { key: net.bridge.bridge-nf-call-iptables, value: "1" }
    - { key: net.bridge.bridge-nf-call-ip6tables, value: "1" }
    - { key: net.ipv4.ip_forward, value: "1" }
